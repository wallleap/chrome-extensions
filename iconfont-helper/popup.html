<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>IconFont Helper</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div id="app">
      <h1 class="title">
        IconFont Helper <span class="version">(3.0.0)</span>
      </h1>
      <div class="main">
        <dl class="control-group">
          <dt>选择操作</dt>
          <dd>
            <button class="control-button" id="select-all">全选</button>
            <button class="control-button" id="select-invert">反选</button>
          </dd>
        </dl>
        <dl class="control-group">
          <dt>下载操作</dt>
          <dd>
            <button class="control-button" id="download-selected" disabled>
              下载选中图标
            </button>
          </dd>
        </dl>
      </div>
      <p class="copyright">
        developed by
        <a href="http://www.yeenuo.net" target="_blank">DaWangRaoMing</a>
      </p>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
